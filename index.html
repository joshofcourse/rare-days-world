ination powering a community of 2000+ female entrepreneurs.","thumb":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/682f4ef1aefd04a7c9b2afe5_thumbnail-p-1600.webp","hover":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/682f4ef1aefd04a7c9b2afe5_thumbnail-p-1600.webp","case":true,"title":"Entreprenista","about":"Stephanie Cartin and Courtney Spritzer, the dynamic duo behind Entreprenista, have built a powerful ecosystem for women founders. What began as a social media agency (Socialfly) evolved into a mission to empower women entrepreneurs through their podcast, community platform, and educational resources. From their own journey scaling a seven-figure agency to hosting events and celebrating women-founded businesses through the Entreprenista 100 Awards, Stephanie and Courtney have created the support system they wish they had when starting their first business.","sections":{"Ask":"Transform the Entreprenista website from a simple landing page into a comprehensive content destination that would both serve as an educational resource as well as convert visitors into paying members of the Entreprenista community.","Approach":"We reimagined what Entreprenista’s website could be, creating a dynamic content hub that serves up personalized resources based on each visitor's specific role and needs. We strategically interwove membership benefits with powerful community testimonials, showing (not telling) the value of joining. All of this was wrapped in Entreprenista's vibrant new brand identity, with a robust design system ensuring consistency across every touchpoint.","Impact":"The new platform has become the digital heart of the Entreprenista community, with an ever-growing library of articles, podcast episodes, founder stories, and event information. By balancing rich content with clear pathways to membership, we've created a destination that draws entrepreneurs back again and again, while steadily growing the Entreprenista League's membership to over 2,000 ambitious founders."},"quote":"","media":[{"t":"i","u":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/682f4f15571e1a70de0e46cd_Hero-p-1600.webp"},{"t":"v","u":"https://raredays-assets.s3.ca-central-1.amazonaws.com/Case+Studies/Entreprenista/1.mp4","id":"fa9bca4ac3"},{"t":"i","u":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/682f4f568c8c7c97e9aad773_image-1-p-1600.webp"},{"t":"i","u":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/682f4f77318ca8f092aea0bd_image-2-p-1600.webp"},{"t":"i","u":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/682f4f765cf31638179b2b1f_image-3-p-1600.webp"},{"t":"i","u":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/682f4f763adc8b81decd11a8_image-4-p-1600.webp"},{"t":"i","u":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/682f4f762887c0455a3b8485_image-5-p-1600.webp"},{"t":"i","u":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/682f4f7629f2d695a8672479_image-6-p-1600.webp"},{"t":"i","u":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/682f50790ca884ab2b8817fc_image-7-p-1600.webp"},{"t":"i","u":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/682f50840e53f3b4f2185a7f_image-8-p-1600.webp"},{"t":"i","u":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/682f50940954b5fdff059aba_image-9-p-1600.webp"},{"t":"i","u":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/682f509c2540bdeaada7a744_image-10-p-1600.webp"},{"t":"i","u":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/682f509cb24ca29aa5e2ee7c_image-11-p-1600.webp"},{"t":"i","u":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/682f509c9806499474e99e6f_image-12-p-1600.webp"},{"t":"i","u":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/682f509c9fe14c6449c437e5_image-13-p-1600.webp"},{"t":"i","u":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/682f509c318ca8f092af7c92_image-14-p-1600.webp"},{"t":"v 2f585d6e67bd3f0386ff3a_thumbnail-p-1600.webp","hover":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/682f585d6e67bd3f0386ff3a_thumbnail-p-1600.webp","case":true,"title":"Tamara Odinec","about":"Tamara Odinec, founder and CEO of My Next Chapter, recognized a critical gap in support for people navigating divorce. Drawing from personal experience, she envisioned a platform that would transform the overwhelming, isolating journey of divorce into an opportunity for growth, learning, and community. Her vision goes beyond merely surviving divorce, and is instead about empowering individuals to thrive in their next chapter.","sections":{"Ask":"Create a comprehensive platform that supports individuals through all stages of divorce—from first considering the thought to post-divorce life—with expert-led content, practical resources, and a supportive community. The platform needed to transform the typically grim, stressful and overwhelming experience of divorce into a journey of empowerment and possibility.","Approach":"We developed a \"proto brand\" and custom membership platform that prioritized personalization. Rather than overwhelming users with information, we created an onboarding process that tailors content to each individual's specific stage in the divorce journey and their unique needs. The Minimum Lovable Product included everything essential to meet these users where they are at, from expert video content to downloadable templates and a vibrant community space, while excluding anything unnecessary that might complicate the user experience.","Impact":"My Next Chapter now offers a comprehensive support system for people navigating divorce, transforming what's typically seen as an ending into a new beginning. The platform delivers personalized content roadmaps, expert-led resources that demystify complex topics from legal concerns to emotional wellbeing, and a community that proves no one has to face divorce alone."},"quote":"","media":[{"t":"i","u":"http ps://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/6a7b4ca05b4af507bf1c5415_IMG-p-1600.webp","case":false,"title":"IMG","about":"","sections":{},"quote":"","media":[{"t":"i","u":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/6a7b4ca05b4af507bf1c5415_IMG-p-1600.webp"}],"images":["https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/6a7b4ca05b4af507bf1c5415_IMG-p-1600.webp"],"thumbVideoId":""},{"thumbVideo":"","slug":"beehiiv-ai","client":"beehiiv","name":"","desc":"Designed and engineered the place for beehiiv’s publishers and their audiences to interact.","thumb":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/6a74bc015ceee802d693048c_Thumbnail%20-%20Beehiiv-p-1600.webp","hover":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/6a74bc015ceee802d693048c_Thumbnail%20-%20Beehiiv-p-1600.webp","case":true,"title":"beehiiv","about":"beehiiv is the platform newsletter publishers and creators build their businesses on. Arnold Schwarzenegger's Pump Club, Colin & Samir's The Publish Press, TIME Magazine, and thousands more run on beehiiv. Founded in 2021 by Tyler Denk (formerly of Morning Brew), beehiiv quickly outgrew newsletters, adding monetization, website publishing, and a network of users that was growing exponentially.","sections":{"Ask":"beehiiv has scaled well beyond email, but their most engaged publishers were still sending audiences to other community platforms. They needed Community built natively by a team that could ship alongside their engineers. And they wanted a partner who could plug into their Claude environment, use it to understand their codebase rapidly, and help design where AI-native features could differentiate their Community product from a growing field of competitors.","Approach":"We began with a Strategy & Design phase where we determined how Community was designed and placed within the broader beehiiv product ecosystem. We answered key questions, like how the brand should cascade, from a publisher's main newsletter and site through to their Community UI. That work led to a theming system, so publishers could carry their brand without beehiiv maintaining a third design system. Following this body of work, we embedded with beehiiv's engineering team: a shared ticket pool, daily standups, one-week sprints, each engineer owning a full epic. Claude Code sat at the center of how we worked. We leveraged it to get up to speed on an unfamiliar codebase fast, scope requirements, and write tests that kept quality in step with velocity. Alongside the build, we ran AI strategy with beehiiv and scoped where AI belonged inside a community product. That landed on an MCP integration powered by Claude, letting publishers manage their communities directly through an AI assistant.","Impact":"Community launched July 2026 at beehiiv's Summer Release Event and changed how beehiiv's creators and their audiences engage: a feed that surfaces active discussions, real-time chat inside the creator's own platform, and newsletter posts that arrive with their own comment thread. beehiiv scoped Community as an 8-month build. With Rare Days and Claude Code embedded in beehiiv's engineering workflow, the team shipped an alpha to early users in 4 months, giving a first version in half the time originally forecast. Publishers also now manage their communities directly through Claude via an MCP integration beehiiv built alongside the product itself. beehiiv's own engineers are now building on Community with us, and the Claude-powered feature work continues into 2027."},"quote":"\"Rare Days has exceptionally high standards for engineering and AI implementation. We released this product two times faster than we forecasted. They helped level up our internal engineering team, and owned core parts of this product that accelerated us enormously.”","media":[{"t":"i","u":"https://cdn.prod.website-files.com/675cd82413fb9b4ff3beb759/6a6cdae5cc20dc411f1fdcdf_beehiiv-community-00-hero-p-1600.webp"},{"t":"   uniform vec3 uBg; uniform float uFogNear, uFogFar, uNear0, uNear1; uniform vec3 uTint;
  varying vec2 vUv; varying float vDepth;
  float sdRound(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
  void main(){
    vec2 p = (vUv - .5) * uSize;
    float d = sdRound(p, uSize * .5, uRadius);
    float aa = fwidth(d) * 1.2;
    float mask = 1. - smoothstep(-aa, aa, d);
    vec2 uv = (vUv - .5) * (1. - .07 * uHover) + .5;
    if (!gl_FrontFacing) uv.x = 1. - uv.x;
    vec2 off = vec2(uShift, uShift * .3);
    vec3 col = vec3(texture2D(uTex, uv + off).r, texture2D(uTex, uv).g, texture2D(uTex, uv - off).b);
    // loading shimmer
    float sh = .5 + .5 * sin((vUv.x + vUv.y) * 6.);
    col = mix(uTint * (.55 + .15 * sh), col, uLoaded);
    float g = dot(col, vec3(.299, .587, .114));
    col = mix(col, vec3(g) * .55, uDim);
    if (!gl_FrontFacing) col *= .45;
    float fog = smoothstep(uFogFar, uFogNear, vDepth);
    col = mix(uBg, col, fog);
    float a = mask * uAlpha * uGlobal * smoothstep(uNear0, uNear1, vDepth);
    if (a < .003) discard;
    gl_FragColor = vec4(col, a);
  }`;

const WORLD_VERT = /* glsl */`
  uniform float uBend, uTime, uPhase, uHover;
  varying vec2 vUv; varying float vDepth;
  void main(){
    vUv = uv;
    vec3 p = position;
    p.z += sin(uv.x * 3.14159) * uBend * .6 + sin(uv.y * 3.14159) * uBend * .25;
    p.z += sin(uv.x * 5. + uTime * 1.3 + uPhase) * .025 * (1. - uHover);
    p.z += sin(uv.y * 3.14159) * sin(uv.x * 3.14159) * uHover * .06;
    vec4 mv = modelViewMatrix * vec4(p, 1.);
    vDepth = -mv.z;
    gl_Position = projectionMatrix * mv;
  }`;

const SPACE_VERT = /* glsl */`
  uniform float uBend, uR, uW, uTime, uPhase;
  varying vec2 vUv; varying float vDepth;
  void main(){
    vUv = uv;
    float x = position.x * uW;
    float a = x / uR;
    vec3 p = vec3(sin(a) * uR / uW, position.y, uR - cos(a) * uR);
    p.z += sin(uv.y * 3.14159) * uBend;
    p.y += sin(uv.x * 3.14159 + uTime * .8 + uPhase) * .004;
    vec4 mv = modelViewMatrix * vec4(p, 1.);
    vDepth = -mv.z;
    gl_Position = projectionMatrix * mv;
  }`;

function makeMat(vert, glob, extra = {}) {

    uniforms: {
      ...glob,
      uFogNear: glob.uFogNear || { value: 50 }, uFogFar: glob.uFogFar || { value: 80 },
      uNear0: { value: .4 }, uNear1: { value: 2.4 },
      uTex: { value: null }, uSize: { value: new THREE.Vector2(1, 1) }, uRadius: { value: .07 },
      uAlpha: { value: 1 }, uHover: { value: 0 }, uDim: { value: 0 }, uShift: { value: 0 }, uBend: { value: 0 },
      uPhase: { value: rnd() * 6.28 }, uLoaded: { value: 0 }, uTint: { value: new THREE.Color(.2, .2, .2) },
      ...extra,

const loader = new THREE.TextureLoader();

const vidSrc = {};

    s.onload = async () => {

async function makeVideo(id) {

  const v = document.createElement('video');
  Object.assign(v, { src: url, muted: true, loop: true, playsInline: true, autoplay: true });
  await new Promise(r => { v.onloadeddata = r; v.onerror = r; });

// animated gifs: decode frames into a canvas texture
async function animGif(url) {
  if (!('ImageDecoder' in window)) return null;
  try {
    const r = await fetch(url, { mode: 'cors' });
    const dec = new ImageDecoder({ data: r.body, type: 'image/gif' });
    await dec.tracks.ready; await dec.completed;
    const n = dec.tracks.selectedTrack.frameCount;
    if (n < 2) { dec.close(); return null; }
    let frame = (await dec.decode({ frameIndex: 0 })).image;
    const c = document.createElement('canvas');
    c.width = frame.displayWidth; c.height = frame.displayHeight;
    const ctx = c.getContext('2d');
    const tx = new THREE.CanvasTexture(c);
    tx.minFilter = THREE.LinearFilter; tx.generateMipmaps = false;
    const g = { tx, aspect: c.width / c.height, alive: true, stop() { this.alive = false; } };
    let i = 0;
    const step = async () => {
      if (!g.alive) { frame.close(); dec.close(); return; }
      ctx.clearRect(0, 0, c.width, c.height); ctx.drawImage(frame, 0, 0); tx.needsUpdate = true;
      const dur = (frame.duration || 1e5) / 1000; frame.close();
      i = (i + 1) % n;
      frame = (await dec.decode({ frameIndex: i })).image;
      setTimeout(step, Math.max(20, dur));
    };
    step();
    return g;
  } catch { return null; }
}
const isGif = u => /\.gif$/i.test(u);
function avgColor(img) {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 10;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0, 10, 10);
    const d = x.getImageData(0, 0, 10, 10).data; let r = 0, g = 0, b = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) { const w = 1 + Math.abs(d[i] - d[i + 2]) / 64; r += d[i] * w; g += d[i + 1] * w; b += d[i + 2] * w; n += w; }
    return new THREE.Color(r / n / 255, g / n / 255, b / n / 255);
  } catch { return new THREE.Color(.25, .25, .25); }
}

// ---------- layouts ----------
const COLS = 7, ROWS = 4, CW = 3.05, CH = 2.62;
const SPH_C = new THREE.Vector3(0, 0, -3), SPH_R = 5.4;
const _e = new THREE.Euler(), _m = new THREE.Matrix4(), _up = new THREE.Vector3(0, 1, 0), ZERO = new THREE.Vector3();
const _dir = new THREE.Vector3();
const mk = () => ({ p: new THREE.Vector3(), q: new THREE.Quaternion(), s: 1 });
const A = mk(), B = mk(), F = mk();

function layout(mode, it, t, o) {
  if (mode === 'cloud' || mode === 'intro') {
    let z = (it.cz + S.fly) % L; if (z < 0) z += L;
    z = NEAR - z;
    if (mode === 'intro') z -= 46;
    const a = it.i * 2.39996 + S.roll;
    const ax = clamp(cam.aspect * .85, .7, 1.7);
    o.p.set(Math.cos(a) * it.rad * ax + Math.sin(t * .31 + it.phase) * .25,
            Math.sin(a) * it.rad * .72 + Math.cos(t * .27 + it.phase) * .22, z);
    _e.set(Math.sin(t * .23 + it.phase) * .07, -o.p.x * .025 + Math.cos(t * .19 + it.phase) * .07,
           Math.sin(t * .17 + it.phase) * .05 + clamp(S.rollVel, -.5, .5));
    o.q.setFromEuler(_e); o.s = 1;
  } else if (mode === 'sphere') {
    const y = 1 - (it.i + .5) / N * 2, r = Math.sqrt(1 - y * y), th = it.i * 2.39996;
    _dir.set(Math.cos(th) * r, y, Math.sin(th) * r).applyQuaternion(S.sq);
    o.p.copy(_dir).multiplyScalar(SPH_R + Math.sin(t * .6 + it.phase) * .12).add(SPH_C);
    _m.lookAt(_dir, ZERO, _up); o.q.setFromRotationMatrix(_m);
    o.s = .78;
  } else { // grid
    const c = it.i % COLS, r = Math.floor(it.i / COLS);
    const x = wrap((c - (COLS - 1) / 2) * CW + S.px, COLS * CW);
    const y = wrap(-(r - (ROWS - 1) / 2) * CH + (c % 2 ? CH * .5 : 0) + S.py, ROWS * CH);
    const fit = Math.min((CW - .42) / (it.size * it.aspect), (CH - .42) / it.size);
    const ripple = clamp(Math.abs(S.speed) * .06, 0, 1.4);
    o.p.set(x, y, 2 + Math.sin(t * .5 + it.phase) * .06 - ripple * (.5 + .5 * Math.cos(Math.hypot(x, y) * .45 - t * 3)));
    _e.set(y * -.012 * ripple, x * .012 * ripple, 0); o.q.setFromEuler(_e);
    o.s = fit;
  }
}

function fullscreenXform(it, o) {
  const D = 4;
  cam.getWorldDirection(_dir);
  o.p.copy(cam.position).addScaledVector(_dir, D);

// ---------- project space ----------
const pgeo = new THREE.PlaneGeometry(1, 1, 48, 1);
const P = { items: [], i: -1, idx: 0, idxT: 0, intro: 0, token: 0, R: 8, H: 4, vel: 0, hover: -1, last: -1, shift: 0 };
const GAP = .55;

function spaceSize() {
  const vh = 2 * P.R * Math.tan(THREE.MathUtils.degToRad(pcam.fov / 2)), vw = vh * pcam.aspect;
  P.H = Math.min(vh * .5, vw * .62 / 1.5);
}
function layoutSpace() {
  const rise = (P.H + .85) / (Math.PI * 2);
  let acc = 0;
  P.items.forEach((it, j) => {
    it.w = P.H * it.aspect;
    if (j > 0) acc += P.items[j - 1].w / 2 + GAP + it.w / 2;
    it.ang = acc / P.R; it.y = -it.ang * rise;
    it.mesh.scale.set(it.w, P.H, 1);
    it.mat.uniforms.uW.value = it.w; it.mat.uniforms.uSize.value.set(it.w, P.H);
  });
}
function sampleAt(idx, key) {
  const n = P.items.length; if (!n) return 0;
  const i0 = clamp(Math.floor(idx), 0, n - 1), i1 = clamp(i0 + 1, 0, n - 1), f = clamp(idx - i0, 0, 1);
  return lerp(P.items[i0][key], P.items[i1][key], f);
}
function clearSpace() {

    it.video?.pause(); it.gif?.stop();

}

  P.items = media.map((m, j) => {
    const u = m.u;

    mat.uniforms.uRadius.value = .1;

    const apply = (tx, aspect) => { mat.uniforms.uTex.value = tx; it.aspect = aspect; layoutSpace(); };
    if (m.t === 'v') {
      makeVideo(m.id).then(r => {
        if (!r) return;

        it.video = r.v; it.src = r.url; apply(r.tx, r.aspect);

    } else if (isGif(u)) {

        : loadTex(u).then(tx => tx && P.token === token && apply(tx, tx.image.width / tx.image.height)));

const tweens = [];

function runTweens(dt) {
  for (let k = tweens.length - 1; k >= 0; k--) {

function setBig(i) {
  if (i === bigI) return; bigI = i;
  if (i < 0) { big.classList.remove('show'); return; }
  const d = DATA[i];
  big.classList.remove('show');
  big.querySelector('.client').innerHTML = [...d.client].map((c, k) => `<span style="transition-delay:${k * 18}ms">${c === ' ' ? '&nbsp;' : esc(c)}</span>`).join('');
  big.querySelector('.meta').textContent = [d.name, d.desc].filter(Boolean).join(' — ');
  requestAnimationFrame(() => requestAnimationFrame(() => bigI === i && big.classList.add('show')));
}
const cursor = $('#cursor'), ctxt = cursor.querySelector('.txt');
let curMode = '';
function setCursor(m, label = '') {
  if (m === curMode && ctxt.textContent === label) return;
  curMode = m; cursor.className = m; ctxt.textContent = label;
}
const cpos = { x: innerWidth / 2, y: innerHeight / 2, tx: innerWidth / 2, ty: innerHeight / 2 };

// ---------- input ----------
const ptr = new THREE.Vector2(-9, -9);
const ray = new THREE.Raycaster();
let drag = null, overCanvas = true;
canvas.addEventListener('pointerdown', e => {
  if (S.view !== 'world' && S.view !== 'project') return;
  drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, vx: 0, vy: 0, moved: 0, id: e.pointerId };
  canvas.setPointerCapture(e.pointerId);
});
addEventListener('pointermove', e => {
  cpos.tx = e.clientX; cpos.ty = e.clientY;
  S.mx = e.clientX / innerWidth * 2 - 1; S.my = -(e.clientY / innerHeight * 2 - 1);
  ptr.set(S.mx, S.my);
  overCanvas = e.target === canvas;
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  drag.vx = lerp(drag.vx, dx, .5); drag.vy = lerp(drag.vy, dy, .5);
  drag.moved += Math.abs(dx) + Math.abs(dy);
  if (drag.moved > 6) { canvas.classList.add('dragging'); applyDrag(dx, dy); }
});
function applyDrag(dx, dy) {
  if (S.view === 'world') {
    if (S.mode === 'cloud') { S.flyT += dy * .045; S.rollT += dx * .0035; }
    else if (S.mode === 'sphere') { S.ryT += dx * .006; S.rxT = clamp(S.rxT + dy * .006, -1.2, 1.2); }
    else { const k = 2 * 8 * Math.tan(THREE.MathUtils.degToRad(25)) / innerHeight; S.pxT += dx * k; S.pyT -= dy * k; }
  } else if (S.view === 'project') {
    P.idxT = clamp(P.idxT - dx / (innerWidth * .28) - dy / (innerHeight * .6), -.3, P.items.length - .7);
  }
}
addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null; canvas.classList.remove('dragging');
  if (d.moved > 6) {
    applyDrag(d.vx * 7, d.vy * 7);
    if (S.view === 'project') P.idxT = clamp(Math.round(P.idxT), 0, P.items.length - 1);
    return;
  }
  // click
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight * 2 - 1));
  if (S.view === 'world') {
    const i = pick(); if (i >= 0) openProject(i);
  } else if (S.view === 'project') {
    const j = pickSpace();
    if (j >= 0) { if (j === Math.round(P.idx)) openLB(j); else P.idxT = j; }
  }
});
addEventListener('pointercancel', () => { drag = null; canvas.classList.remove('dragging'); });

let snapT;
addEventListener('wheel', e => {
  if (e.target.closest('.panel, #index, #lb')) return;
  e.preventDefault();
  const m = e.deltaMode === 1 ? 32 : 1;
  const dy = clamp(e.deltaY * m, -120, 120), dx = clamp(e.deltaX * m, -120, 120);
  if (S.view === 'world') {
    if (S.mode === 'cloud') { S.flyT += dy * .012; S.rollT += dx * .002; }
    else if (S.mode === 'sphere') { S.ryT += (dy + dx) * .0025; }
    else { S.pyT += dy * .012; S.pxT -= dx * .012; }
  } else if (S.view === 'project') {
    P.idxT = clamp(P.idxT + (dy + dx) * .0045, -.3, P.items.length - .7);
    clearTimeout(snapT); snapT = setTimeout(() => P.idxT = clamp(Math.round(P.idxT), 0, P.items.length - 1), 160);
  }
}, { passive: false });

addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (lbJ >= 0) closeLB(); else if ($('#index').classList.contains('open')) closeIndex(); else closeProject();
  }
  if (lbJ >= 0) { if (e.key === 'ArrowRight') stepLB(1); if (e.key === 'ArrowLeft') stepLB(-1); return; }
  if (S.view === 'project') {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') P.idxT = clamp(Math.round(P.idxT) + 1, 0, P.items.length - 1);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') P.idxT = clamp(Math.round(P.idxT) - 1, 0, P.items.length - 1);
    if (e.key === 'Enter') openLB(clamp(Math.round(P.idx), 0, P.items.length - 1));
  } else if (S.view === 'world') {
    if (e.key === '1') setMode('cloud'); if (e.key === '2') setMode('sphere'); if (e.key === '3') setMode('grid');
  }
});

function pick() {
  ray.setFromCamera(ptr, cam);
  const hits = ray.intersectObjects(items.filter(it => it.mat.uniforms.uAlpha.value > .4).map(it => it.mesh), false);
  for (const h of hits) {
    const it = items[h.object.userData.i];
    const depth = h.distance;
    if (depth > 1.6 && depth < shared.uFogFar.value - 4) return it.i;
  }
  return -1;
}
function pickSpace() {
  ray.setFromCamera(ptr, pcam);
  const hits = ray.intersectObjects(P.items.map(it => it.mesh), false);
  return hits.length ? hits[0].object.userData.j : -1;
}

// ---------- resize ----------
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  cam.aspect = pcam.aspect = w / h;
  cam.fov = w / h < .8 ? 62 : 50;
  cam.updateProjectionMatrix(); pcam.updateProjectionMatrix();
  if (P.items.length) { spaceSize(); layoutSpace(); }
}
addEventListener('resize', resize); resize();

// ---------- loop ----------
let last = performance.now(), t = 0, prevFly = 0, prevRoll = 0, prevRy = 0, prevPx = 0, prevPy = 0, prevIdx = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  shared.uTime.value = t;
  runTweens(dt);

  S.mxs = damp(S.mxs, isTouch ? 0 : S.mx, 3, dt); S.mys = damp(S.mys, isTouch ? 0 : S.my, 3, dt);
  cpos.x = damp(cpos.x, cpos.tx, 18, dt); cpos.y = damp(cpos.y, cpos.ty, 18, dt);
  cursor.style.transform = `translate3d(${cpos.x}px,${cpos.y}px,0)`;

  // background
  S.bg.r = damp(S.bg.r, S.bgT.r, 2.5, dt); S.bg.g = damp(S.bg.g, S.bgT.g, 2.5, dt); S.bg.b = damp(S.bg.b, S.bgT.b, 2.5, dt);
  shared.uBg.value.copy(S.bg);
  renderer.setClearColor(S.bg, 1);

  // ---- world ----
  const live = S.view === 'world' || S.view === 'loading';
  if (shared.uGlobal.value > .001 || S.view === 'world') {
    const hovered = S.hover >= 0 || S.forceHover >= 0;
    if (S.view === 'world' && !drag) {
      if (S.mode === 'cloud') S.flyT += dt * (hovered ? .12 : .75);
      else if (S.mode === 'sphere') S.ryT += dt * (hovered ? .01 : .07);
      else S.pxT -= dt * (hovered ? .03 : .22);
    }
    S.fly = damp(S.fly, S.flyT, 4, dt); S.roll = damp(S.roll, S.rollT, 4, dt);
    S.rx = damp(S.rx, S.rxT, 4, dt); S.ry = damp(S.ry, S.ryT, 4, dt);
    S.px = damp(S.px, S.pxT, 4, dt); S.py = damp(S.py, S.pyT, 4, dt);
    _e.set(S.rx, S.ry, 0, 'XYZ'); S.sq.setFromEuler(_e);
    let sp = 0;
    if (S.mode === 'cloud') sp = (S.fly - prevFly) / dt;
    else if (S.mode === 'sphere') sp = (S.ry - prevRy) / dt * 6;
    else sp = Math.hypot(S.px - prevPx, S.py - prevPy) / dt * 2;
    S.rollVel = damp(S.rollVel, (S.roll - prevRoll) / dt * .25, 6, dt);
    prevFly = S.fly; prevRoll = S.roll; prevRy = S.ry; prevPx = S.px; prevPy = S.py;
    S.speed = damp(S.speed, sp, 6, dt);

    if (S.mt < 1) S.mt = Math.min(1, S.mt + dt / S.mtDur);
    const fk = inOut(S.mt);
    const f0 = FOG[S.prevMode], f1 = FOG[S.mode];
    shared.uFogNear.value = lerp(f0[0], f1[0], fk); shared.uFogFar.value = lerp(f0[1], f1[1], fk);

    cam.position.set(S.mxs * .55, S.mys * .35, 10);
    cam.lookAt(S.mxs * .15, S.mys * .1, 0);
    cam.updateMatrixWorld();

    // hover
    if (S.view === 'world' && !drag && !$('#index').classList.contains('open')) {
      S.hover = isTouch || !overCanvas ? -1 : pick();
    } else if (S.view === 'world') S.hover = -1;
    const hv = S.forceHover >= 0 ? S.forceHover : S.hover;
    if (S.view === 'world') {
      setBig(hv);
      if (drag && drag.moved > 6) setCursor('drag');
      else setCursor(S.hover >= 0 ? 'big' : '', S.hover >= 0 ? 'Enter' : '');
      S.bgT = hv >= 0 ? BASE_BG.clone().lerp(items[hv].color, .22) : BASE_BG.clone();
    }

    const bend = clamp(-S.speed * .05, -.9, .9), shift = Math.min(Math.abs(S.speed) * .0009, .014);
    const eo = inOut(S.open);
    for (const it of items) {
      layout(S.mode, it, t, A);
      if (S.mt < 1) {
        layout(S.prevMode, it, t, B);
        const k = inOut(clamp(S.mt * 1.6 - it.stagger * .6, 0, 1));
        A.p.lerpVectors(B.p, A.p, k); A.q.slerpQuaternions(B.q, A.q, k); A.s = lerp(B.s, A.s, k);
      }
      it.hover = damp(it.hover, it.i === hv ? 1 : 0, 8, dt);
      it.dim = damp(it.dim, hv >= 0 && it.i !== hv ? 1 : 0, 6, dt);
      let alpha = 1;
      if (eo > 0) {
        if (it.i === S.openI) {
          fullscreenXform(it, F);
          A.p.lerp(F.p, eo); A.q.slerp(F.q, eo); A.s = lerp(A.s, F.s, eo);
        } else {
          A.p.x *= 1 + eo * 1.6; A.p.y *= 1 + eo * 1.6; A.p.z -= eo * 6;
          alpha = 1 - eo;
        }
      }
      const s = A.s * (1 + it.hover * .07);
      it.mesh.position.copy(A.p); it.mesh.quaternion.copy(A.q);
      it.mesh.scale.set(it.size * it.aspect * s, it.size * s, 1);
      it.mesh.renderOrder = it.i === S.openI && eo > 0 ? 10 : 0;
      const u = it.mat.uniforms;
      u.uAlpha.value = alpha; u.uHover.value = it.hover; u.uDim.value = it.dim * .55;
      u.uBend.value = bend * (1 - eo); u.uShift.value = shift * (1 - eo);
      u.uSize.value.set(it.size * it.aspect, it.size);
      u.uRadius.value = lerp(.08, .0, it.i === S.openI ? eo : 0);
      u.uNear0.value = it.i === S.openI ? lerp(.4, 0, eo) : .4;
      u.uNear1.value = it.i === S.openI ? lerp(2.4, .1, eo) : 2.4;
    }
  }

  // ---- project space ----
  if (pShared.uGlobal.value > .001 && P.items.length) {
    P.idx = damp(P.idx, P.idxT, 5, dt);
    const vel = (P.idx - prevIdx) / dt; prevIdx = P.idx;
    P.vel = damp(P.vel, vel, 8, dt);
    const ei = P.intro;
    const ang = sampleAt(P.idx, 'ang') - (1 - ei) * 1.4;
    const y = sampleAt(P.idx, 'y') + (1 - ei) * 2.5;
    pcam.position.set(S.mxs * .25, y + S.mys * .25, 0);
    pcam.rotation.set(S.mys * .05 + (1 - ei) * .25, -ang - S.mxs * .1, 0);
    const shiftT = innerWidth > 760 && document.body.classList.contains('proj') && !document.body.classList.contains('panel-closed') ? Math.min(200, innerWidth * .14) : 0;
    P.shift = damp(P.shift, shiftT, 3, dt);
    pcam.setViewOffset(innerWidth, innerHeight, -P.shift, 0, innerWidth, innerHeight);
    pcam.updateMatrixWorld();
    if (S.view === 'project' && !drag && lbJ < 0) {
      const j = isTouch || !overCanvas ? -1 : pickSpace();
      P.hover = j;
      setCursor(j >= 0 ? 'big' : '', j < 0 ? '' : j === Math.round(P.idx) ? 'Open' : 'Go');
    } else if (S.view === 'project' && drag && drag.moved > 6) setCursor('drag');
    else if (lbJ >= 0) setCursor('');
    else if (S.view !== 'project') P.hover = -1;
    const bend = clamp(P.vel * .35, -1.2, 1.2), shift = Math.min(Math.abs(P.vel) * .004, .016);
    for (const it of P.items) {
      const dist = Math.abs(it.j - P.idx);
      const a = out(clamp(ei * 1.5 - dist * .1, 0, 1));
      it.hover = damp(it.hover, it.j === P.hover ? 1 : 0, 8, dt);
      const tex = it.mat.uniforms.uTex.value;
      it.loaded = damp(it.loaded, tex ? 1 : 0, 4, dt);
      const s = 1 + it.hover * .03;
      it.mesh.position.set(P.R * Math.sin(it.ang), it.y - (1 - a) * 3, -P.R * Math.cos(it.ang));
      it.mesh.rotation.set(0, -it.ang, (1 - a) * .15);
      it.mesh.scale.set(it.w * s, P.H * s, 1);
      const u = it.mat.uniforms;
      u.uAlpha.value = a; u.uHover.value = it.hover; u.uLoaded.value = it.loaded;
      u.uDim.value = clamp((dist - .55) * .5, 0, .6) * (1 - it.hover);
      u.uBend.value = bend; u.uShift.value = shift;
      if (it.video) {
        const want = dist < 3.5 && lbJ < 0;
        if (want && it.video.paused) it.video.play().catch(() => {});
        else if (!want && !it.video.paused) it.video.pause();
      }
    }
    updateHud();
  }

  renderer.clear();
  if (shared.uGlobal.value > .001) renderer.render(world, cam);
  if (pShared.uGlobal.value > .001) { renderer.clearDepth(); renderer.render(space, pcam); }
  requestAnimationFrame(frame);
}

// ---------- boot ----------
(async () => {
  let done = 0;
  await Promise.all(items.map(async it => {
    const tx = await loadTex(sized(it.d.thumb, 800), it.d.thumb);
    if (tx) {
      it.mat.uniforms.uTex.value = tx; it.mat.uniforms.uLoaded.value = 1;
      it.aspect = clamp(tx.image.width / tx.image.height, .6, 2.2);
      it.color = avgColor(tx.image);
      it.mat.uniforms.uTint.value = it.color;
    }
    if (it.d.thumbVideoId) makeVideo(it.d.thumbVideoId).then(r => { if (r) { it.mat.uniforms.uTex.value = r.tx; it.aspect = clamp(r.aspect, .6, 2.2); it.mat.uniforms.uLoaded.value = 1; } });
    else if (isGif(it.d.thumb)) animGif(it.d.thumb).then(g => { if (g) { it.mat.uniforms.uTex.value = g.tx; it.mat.uniforms.uLoaded.value = 1; } });
    done++;
    $('#loadTxt').textContent = `Gathering the work — ${pad(done)} / ${pad(N)}`;
    $('#loadBar').style.width = `${done / N * 100}%`;
  }));
  await document.fonts.ready.catch(() => {});
  $('#loader').classList.add('done');
  S.view = 'world'; S.mt = 0;
})();
requestAnimationFrame(frame);
</script>
</body>
</html>
